name: Pre-commit Checks

on:
  pull_request:
    branches: [ main, contrib ]
    paths-ignore:
      - "example/**"
  push:
    branches: [ main, contrib ]
    paths-ignore:
      - "example/**"

jobs:
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install pre-commit
        run: pip install pre-commit
      
      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Verify committed account.wasm fixture is up to date
        run: |
          make fixtures
          git diff --exit-code contracts/shade/src/tests/fixtures/account.wasm || \
            (echo "::error::account.wasm fixture is stale. Run 'make fixtures' and commit the result." && exit 1)

